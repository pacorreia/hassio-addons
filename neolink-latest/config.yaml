name: "Neolink-latest"
description: "Will run latest Neolink directly as App in HAOS"
version: "0.1.1"
slug: "neolink-latest"
image: "docker.io/pfmc82/neolink:latest"
arch:
  - amd64
  - aarch64
host_network: true
map:
  - addon_config:rw
  - homeassistant_config:rw
options:
  mode: rtsp
  log: info
schema:
  mode: list(rtsp|mqtt|dual)
  log: list(info|warn|error|debug)
