name: "Neolink-latest"
description: "Will run latest Neolink directly as App in HAOS"
version: "pr-11"
slug: "neolink-latest"
url: "https://github.com/pacorreia/hassio-addons"
image: "docker.io/pfmc82/neolink"
arch:
  - amd64
  - aarch64
host_network: true
map:
  - config:rw
  - homeassistant_config:rw
options:
  mode: rtsp
  log: info
schema:
  mode: list(rtsp|mqtt|dual)
  log: list(info|warn|error|debug)
